<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Water Bill Payment</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary-color: #003087;
      --light-bg: #f0f4ff;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      color: #333;
      background-color: white;
      
    }
    header {
      background-color: #003087;
      text-align: center;
      padding: 1rem 0;
      margin-bottom: 30px;
      height:74px;
    }
    h1 {
      color: white;
      text-align: center;
    }
    .container {
      max-width: 1400px;
      margin-bottom: 30px;
      margin-left: 60px;
      background: white;
      padding: 30px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
      transition: border 0.3s;
    }

    input:focus, select:focus {
      border-color: var(--primary-color);
      outline: none;
    }

    .submit-btn {
      background: var(--primary-color);
      color: white;
      font-weight: bold;
      border: none;
      margin-top: 20px;
      cursor: pointer;
    }

    .confirmation {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #e0f9e0;
      color: #2d7f2d;
    }

    .summary, .history {
      margin-top: 30px;
    }

    .summary-box {
      background: var(--light-bg);
      padding: 15px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .history table {
      width: 100%;
      border-collapse: collapse;
    }

    .history th, .history td {
      padding: 10px;
      border-bottom: 1px solid #ccc;
    }

    .receipt-btn {
      margin-top: 20px;
      background: #009688;
      color: white;
      font-weight: bold;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      input, select, button {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <header><h1>Water Bill Payment</h1></header>
  <div class="container">
    <form id="waterForm">
      <label for="provider">💧 Water Board</label>
      <select id="provider" required>
        <option value="">-- Select Board --</option>
        <option>Delhi Jal Board</option>
        <option>Bangalore Water Supply (BWSSB)</option>
        <option>Hyderabad Metro Water</option>
        <option>Chennai Metro Water</option>
      </select>

      <label for="consumerNumber">Consumer Number</label>
      <input type="text" id="consumerNumber" maxlength="15" pattern="\d{10,15}" required placeholder="Enter 10-15 digit consumer number" />

      <label for="areaCode">Zone / Area Code (optional)</label>
      <input type="text" id="areaCode" placeholder="Enter zone or area code if applicable" />

      <label for="billAmount">Bill Amount (₹)</label>
      <input type="number" step="0.01" id="billAmount" placeholder="Enter bill amount" required />

      <button class="submit-btn" type="submit">Pay Water Bill</button>
    </form>

    <div id="confirmation" class="confirmation"></div>

    <div class="summary">
      <h3>Mini Bill Summary</h3>
      <div class="summary-box" id="billSummary">
        <p><strong>Bill Amount:</strong> ₹<span id="summaryAmount">--</span></p>
        <p><strong>Due Date:</strong> <span id="summaryDueDate">--</span></p>
        <p><strong>Consumer Name:</strong> <span id="summaryName">--</span></p>
        <p><strong>Late Fee:</strong> ₹<span id="summaryLateFee">--</span></p>
        <p><strong>Water Board:</strong> <span id="summaryBoard">--</span></p>
        <p><strong>Consumer Number:</strong> <span id="summaryConsumer">--</span></p>

      </div>
    </div>

    <div class="history">
      <h3>Bill Payment History</h3>
      <table>
        <thead>
          <tr><th>Date</th><th>Provider</th><th>Amount</th><th>Status</th></tr>
        </thead>
        <tbody id="historyTable">
          
        </tbody>
      </table>
    </div>

    <button class="receipt-btn" onclick="window.print()">Download/Print Receipt</button>
  </div>

  <script>
   const BASE_URL = "http://localhost:5002"; // backend URL

// Elements
const boardEl = document.getElementById("provider");
const consumerNumberEl = document.getElementById("consumerNumber");
const areaCodeEl = document.getElementById("areaCode");
const consumerNameEl = document.getElementById("consumerName"); // optional
const billAmountEl = document.getElementById("billAmount");
const form = document.getElementById("waterForm");
const confirmation = document.getElementById("confirmation");
const historyTable = document.getElementById("historyTable");

// Mini Bill Summary
const summaryConsumer = document.getElementById("summaryConsumer");
const summaryAmount = document.getElementById("summaryAmount");
const summaryDueDate = document.getElementById("summaryDueDate");

let fetchedBill = null;

// ---------------------
// Fetch bill when board or consumer number changes
// ---------------------
async function tryFetchBill(board, consumerNumber) {
  if (!board || !consumerNumber) return;

  try {
    const res = await fetch(`${BASE_URL}/api/waterbills/fetch`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ board, consumerNumber })
    });

    const data = await res.json();

    if (!data.success) {
      fetchedBill = null;
      confirmation.style.display = "block";
      confirmation.style.background = "#fdecea";
      confirmation.style.color = "#d32f2f";
      confirmation.innerText = "❌ " + data.message + " Enter manually.";
      return;
    }

    fetchedBill = data.bill;

    // Show confirmation with all available fields
    confirmation.style.display = "block";
    confirmation.style.background = "#f0f4ff";
    confirmation.style.color = "#003087";
    confirmation.innerHTML = `
      <strong>Bill Found!</strong><br>
      Board: ${fetchedBill.board || "--"}<br>
      Consumer Number: ${fetchedBill.consumerNumber || "--"}<br>
      Area Code: ${fetchedBill.areaCode || "--"}<br>
      Bill Amount: ₹${fetchedBill.billAmount || 0}<br>
      Status: ${fetchedBill.status || "--"}<br><br>
      <button id="autoFillBtn">Auto-Fill Details</button>
    `;

    document.getElementById("autoFillBtn").onclick = () => {
      if (areaCodeEl) areaCodeEl.value = fetchedBill.areaCode || "";
      if (billAmountEl) billAmountEl.value = fetchedBill.billAmount || "";
      if (consumerNameEl) consumerNameEl.value = fetchedBill.consumerName || "";

      if (summaryConsumer) summaryConsumer.innerText = fetchedBill.consumerName || fetchedBill.consumerNumber || "--";
      if (summaryAmount) summaryAmount.innerText = fetchedBill.billAmount || 0;
      if (summaryDueDate) summaryDueDate.innerText = fetchedBill.dueDate ? new Date(fetchedBill.dueDate).toLocaleDateString() : "--";

      confirmation.style.display = "none";

      loadHistory(fetchedBill.consumerNumber);
    };

  } catch (err) {
    fetchedBill = null;
    confirmation.style.display = "block";
    confirmation.style.background = "#fdecea";
    confirmation.style.color = "#d32f2f";
    confirmation.innerText = "❌ " + err.message;
  }
}

consumerNumberEl.addEventListener("blur", () => tryFetchBill(boardEl.value.trim(), consumerNumberEl.value.trim()));
boardEl.addEventListener("change", () => tryFetchBill(boardEl.value.trim(), consumerNumberEl.value.trim()));

// ---------------------
// Submit payment
// ---------------------
form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const board = boardEl.value.trim();
  const consumerNumber = consumerNumberEl.value.trim();
  const areaCode = areaCodeEl.value.trim();
  const consumerName = consumerNameEl ? consumerNameEl.value.trim() : "";
  const amount = parseFloat(billAmountEl.value);

  if (!board || !consumerNumber || !amount) {
    alert("Please fill all required fields");
    return;
  }

  if (!fetchedBill || !fetchedBill._id) {
    alert("No bill selected to pay");
    return;
  }

  try {
    const res = await fetch(`${BASE_URL}/api/waterbills/pay/${fetchedBill._id}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ paymentMethod: "Online" })
    });

    const data = await res.json();
    if (!data.success) throw new Error(data.message || "Payment failed");

    confirmation.style.display = "block";
    confirmation.style.background = "#e0f9e0";
    confirmation.style.color = "#2d7f2d";
    confirmation.innerText = `✅ Payment successful!\nTxn ID: ${data.receipt.transactionId}\nAmount: ₹${data.receipt.amount}`;

    form.reset();
    if (summaryConsumer) summaryConsumer.innerText = "--";
    if (summaryAmount) summaryAmount.innerText = "0";
    if (summaryDueDate) summaryDueDate.innerText = "--";

    fetchedBill = null; // reset
    loadHistory(consumerNumber);

  } catch (err) {
    confirmation.style.display = "block";
    confirmation.style.background = "#fdecea";
    confirmation.style.color = "#d32f2f";
    confirmation.innerText = "❌ " + err.message;
  }
});

// ---------------------
// Load payment history
// ---------------------
async function loadHistory(consumerNumber) {
  if (!consumerNumber) return;

  try {
    const res = await fetch(`${BASE_URL}/api/waterbills/history/${consumerNumber}`);
    const data = await res.json();

    const payments = Array.isArray(data.history) ? data.history : [];

    historyTable.innerHTML = "";
    if (payments.length === 0) {
      historyTable.innerHTML = `<tr><td colspan="4">No history found</td></tr>`;
      return;
    }

    payments.forEach(p => {
      const row = `
        <tr>
          <td>${new Date(p.date).toLocaleDateString()}</td>
          <td>${p.board}</td>
          <td>₹${p.amount}</td>
          <td>${p.status}</td>
        </tr>
      `;
      historyTable.innerHTML += row;
    });

  } catch (err) {
    historyTable.innerHTML = `<tr><td colspan="4">Error loading history</td></tr>`;
    console.error(err);
  }
}

// ---------------------
// Load history on page load if consumer number is filled
window.onload = () => {
  if (consumerNumberEl.value.trim()) loadHistory(consumerNumberEl.value.trim());
};

  </script>
</body>
</html>
