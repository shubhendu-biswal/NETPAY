<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetPay | User Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f6f9;
            color: #333;
        }

        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 600px;
            border: 1px solid #eef0f2;
            text-align: center;
        }

        h1 {
            color: #003087;
            margin-bottom: 30px;
        }

        .profile-img-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #003087;
        }

        .upload-label {
            position: absolute;
            bottom: 0;
            right: 0;
            background: #003087;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
        }

        input[type="file"] {
            display: none;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background-color: #f8f9fa;
        }

        .btn {
            background-color: #003087;
            color: white;
            padding: 14px;
            width: 100%;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #00225a;
        }

        .back-btn {
            margin-top: 15px;
            background: transparent;
            color: #666;
            border: 1px solid #ccc;
        }

        .back-btn:hover {
            background: #f0f0f0;
            color: #333;
        }

        .message {
            margin-top: 15px;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Your Profile</h1>

        <div class="profile-img-container">
            <img src="https://via.placeholder.com/150" id="profilePreview" class="profile-img" alt="Profile" />
            <label for="fileInput" class="upload-label" title="Change Photo">+</label>
            <input type="file" id="fileInput" accept="image/*" />
        </div>

        <form id="profileForm">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your name" required />
            </div>
            <div class="input-group">
                <label>Phone Number </label>
                <input type="text" id="phone" disabled style="background-color: #eee; cursor: not-allowed;" />
            </div>

            <button type="submit" class="btn">Save Changes</button>
            <button type="button" class="btn back-btn" onclick="window.location.href='netpay2.html'">Back to
                Home</button>
        </form>

        <div class="message" id="message"></div>
    </div>

    <script>
        const BASE_URL = "http://localhost:5002";
        let currentImageBase64 = "";

        // Check Auth
        const token = localStorage.getItem('token');
        const userStr = localStorage.getItem('user');

        if (!token || !userStr) {
            window.location.href = 'login_page.html';
        }

        const user = JSON.parse(userStr);

        // Initialize fields
        document.getElementById('name').value = user.name || "";
        document.getElementById('phone').value = user.phone || "";

        if (user.profileImage) {
            document.getElementById('profilePreview').src = user.profileImage;
            currentImageBase64 = user.profileImage;
        }

        // Handle File Upload (Convert to Base64)
        document.getElementById('fileInput').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                // Limit size to 10MB
                if (file.size > 10 * 1024 * 1024) { // 10MB limit
                    alert("Image is too large. Please select an image under 10MB.");
                    return;
                }

                const reader = new FileReader();
                reader.onload = function (evt) {
                    currentImageBase64 = evt.target.result;
                    document.getElementById('profilePreview').src = currentImageBase64;
                };
                reader.readAsDataURL(file);
            }
        });

        // Handle Submit
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageEl = document.getElementById('message');
            const btn = e.target.querySelector('button[type="submit"]');

            const newName = document.getElementById('name').value;

            btn.textContent = "Saving...";
            btn.disabled = true;

            try {
                const response = await fetch(`${BASE_URL}/auth/update`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        name: newName,
                        profileImage: currentImageBase64
                    })
                });

                const data = await response.json();

                if (data.success) {
                    messageEl.textContent = "Profile updated successfully!";
                    messageEl.style.color = "green";

                    // Update local storage
                    localStorage.setItem('user', JSON.stringify(data.user));

                    setTimeout(() => {
                        messageEl.textContent = "";
                        btn.textContent = "Save Changes";
                        btn.disabled = false;
                    }, 2000);

                } else {
                    messageEl.textContent = data.message || "Update failed";
                    messageEl.style.color = "red";
                    btn.textContent = "Save Changes";
                    btn.disabled = false;
                }

            } catch (err) {
                console.error(err);
                messageEl.textContent = "Server error";
                messageEl.style.color = "red";
                btn.textContent = "Save Changes";
                btn.disabled = false;
            }
        });
    </script>

</body>

</html>
