<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NetPay | Login & Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      color:#333;
      background:white;
      
    }

    .container {
      background-color: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
      max-width: 1200px;
      transition: 0.3s ease;
      margin-left: 150px;
      margin-top: 30px;
    }

    h1 {
      text-align: center;
      color: #003087;
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #333;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      transition: border-color 0.3s;
    }

    .input-group input:focus {
      border-color: #003087;
      outline: none;
    }

    .btn {
      background-color: #003087;
      color: white;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background-color: #00225a;
    }

    .bottom-text {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
    }

    .bottom-text a {
      color: #003087;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    .bottom-text a:hover {
      text-decoration: underline;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    @media (max-width: 500px) {
      .container {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Login Form -->
    <div class="form active" id="loginForm">
      <h1>Login to NetPay</h1>
      <form onsubmit="return validateLogin()">
        <div class="input-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="loginPhone" placeholder="Enter 10-digit number" pattern="[0-9]{10}" required />
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn">Login</button>
      </form>
      <p id="loginMessage"></p>
      <div class="bottom-text">
        Don't have an account? <a onclick="showRegister()">Register Now</a>
      </div>
    </div>

    <!-- Register Form -->
    <div class="form" id="registerForm">
      <h2>Create Your NetPay Account</h2>
      <form onsubmit="return validateRegister()">
        <div class="input-group">
          <label for="regName">Full Name</label>
          <input type="text" id="regName" placeholder="Your Name" required />
        </div>
        <div class="input-group">
          <label for="regPhone">Phone Number</label>
          <input type="tel" id="regPhone" placeholder="10-digit number" pattern="[0-9]{10}" required />
        </div>
        <div class="input-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" placeholder="Create password" required />
        </div>
        <div class="input-group">
          <label for="regConfirmPassword">Confirm Password</label>
          <input type="password" id="regConfirmPassword" placeholder="Confirm password" required />
        </div>
        <button type="submit" class="btn">Register</button>
      </form>
      <p id="regMessage"></p>
      <div class="bottom-text">
        Already have an account? <a onclick="showLogin()">Login</a>
      </div>
    </div>
  </div>

  <script>
const BASE_URL = "http://localhost:5002"; // Backend URL

// Switch forms
function showRegister() {
  document.getElementById('loginForm').classList.remove('active');
  document.getElementById('registerForm').classList.add('active');
}

function showLogin() {
  document.getElementById('registerForm').classList.remove('active');
  document.getElementById('loginForm').classList.add('active');
}

// Login function
async function validateLogin(event) {
  event.preventDefault(); // stop default form submission

  const phone = document.getElementById('loginPhone').value;
  const password = document.getElementById('loginPassword').value;
  const messageEl = document.getElementById('loginMessage');

  if (!/^\d{10}$/.test(phone)) {
    messageEl.textContent = "Enter a valid 10-digit phone number";
    messageEl.style.color = "red";
    return;
  }

  try {
    const response = await fetch(`${BASE_URL}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone, password })
    });

    const data = await response.json();

    if (data.success) {
      messageEl.textContent = "Login Successful ✅";
      messageEl.style.color = "green";
      console.log("Token:", data.token); // you can save this in localStorage if needed
    } else {
      messageEl.textContent = data.message || "Login failed ❌";
      messageEl.style.color = "red";
    }

  } catch (err) {
    console.error(err);
    messageEl.textContent = "Something went wrong ❌";
    messageEl.style.color = "red";
  }
}

// Register function
async function validateRegister(event) {
  event.preventDefault(); // stop default form submission

  const phone = document.getElementById('regPhone').value;
  const password = document.getElementById('regPassword').value;
  const confirmPassword = document.getElementById('regConfirmPassword').value;
  const messageEl = document.getElementById('regMessage');

  if (!/^\d{10}$/.test(phone)) {
    messageEl.textContent = "Enter a valid 10-digit phone number";
    messageEl.style.color = "red";
    return;
  }
  if (password.length < 6) {
    messageEl.textContent = "Password must be at least 6 characters long";
    messageEl.style.color = "red";
    return;
  }
  if (password !== confirmPassword) {
    messageEl.textContent = "Passwords do not match";
    messageEl.style.color = "red";
    return;
  }

  try {
    const response = await fetch(`${BASE_URL}/auth/register`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone, password })
    });

    const data = await response.json();

    if (data.success) {
      messageEl.textContent = "Sign up successful ✅";
      messageEl.style.color = "green";
      showLogin();
    } else {
      messageEl.textContent = data.message || "Sign up failed ❌";
      messageEl.style.color = "red";
    }

  } catch (err) {
    console.error(err);
    messageEl.textContent = "Something went wrong ❌";
    messageEl.style.color = "red";
  }
}

// Attach submit listeners properly
document.querySelector("#loginForm form").addEventListener("submit", validateLogin);
document.querySelector("#registerForm form").addEventListener("submit", validateRegister);


  </script>
</body>
</html>
